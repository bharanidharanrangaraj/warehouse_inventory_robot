# ros2_control for the rover's arm and gripper (loaded by gazebo_ros2_control).
# The wheels are driven by gazebo_ros_diff_drive (cmd_vel / odom for Nav2).
controller_manager:
  ros__parameters:
    update_rate: 50
    use_sim_time: true
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    use_sim_time: true
    joints: [arm_turret, arm_shoulder, arm_elbow, arm_wrist]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 25.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0

gripper_controller:
  ros__parameters:
    use_sim_time: true
    joints: [gripper_left_joint, gripper_right_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 25.0
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
